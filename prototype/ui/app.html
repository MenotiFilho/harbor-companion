<!doctype html>
<!--
  PROTÓTIPO FINAL — descartável, não é código de produção.

  Direção: Editorial Cinema (variante C) + Cinemascope com sangria no Remote.
  Paleta escura com acento testável (indigo padrão). Vidro discreto onde couber.

  Seletor de destaque: bolinhas na pílula flutuante, setas ← → ou ?accent=<key>.
  Telas: aba superior. Rodar:
    python3 -m http.server -d prototype/ui 8000  ->  http://localhost:8000/app.html
-->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Harbor Companion · Protótipo final</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  /* ============ tokens ============ */
  :root{
    --bg:#08080b;
    --bg-elev:#0e0e13;
    --solid:#13131a;
    --solid-2:#1a1a23;
    --ink:#f2f2f4;
    --ink-2:#b6b6c0;
    --ink-3:#787884;
    --hair:rgba(255,255,255,.09);
    --hair-2:rgba(255,255,255,.055);
    /* acento — trocado em runtime pelo seletor */
    --accent:#8f97ff;
    --accent-2:color-mix(in srgb, var(--accent) 62%, #ffffff);
    --accent-dim:color-mix(in srgb, var(--accent) 16%, transparent);
    --accent-line:color-mix(in srgb, var(--accent) 40%, transparent);
    --accent-ink:color-mix(in srgb, var(--accent) 70%, #ffffff);
    --on-accent:#0a0a0f;
    --glass:rgba(255,255,255,.045);
    --glass-2:rgba(255,255,255,.075);
    --glass-hair:rgba(255,255,255,.11);
    --blur:blur(18px) saturate(140%);
    --radius:20px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%}
  body{
    font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(1100px 640px at 78% -12%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 62%),
      radial-gradient(820px 560px at 4% 112%, color-mix(in srgb, var(--accent) 8%, transparent), transparent 60%),
      #050507;
    transition:background .25s ease;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit}
  .serif{font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif}
  .glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-hair)}
  @media (prefers-reduced-motion: reduce){*{animation-duration:.001ms !important;transition-duration:.001ms !important}}

  /* ============ chrome da página ============ */
  .topbar{position:sticky;top:0;z-index:80;display:flex;align-items:center;gap:16px;padding:10px 18px;background:rgba(6,6,9,.8);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.05)}
  .brand{font-weight:600;font-size:13px;letter-spacing:.02em;white-space:nowrap}
  .brand small{display:block;font-weight:400;color:var(--ink-3);font-size:10.5px;margin-top:1px}
  .screens{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-left:auto;padding:2px}
  .screens::-webkit-scrollbar{display:none}
  .screens button{border:1px solid transparent;background:transparent;color:var(--ink-3);padding:6px 12px;border-radius:999px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap}
  .screens button:hover{color:var(--ink-2)}
  .screens button.active{color:var(--on-accent);background:var(--accent);border-color:var(--accent)}
  .hint{color:var(--ink-3);font-size:11px;font-variant-numeric:tabular-nums;white-space:nowrap}

  .stage{display:flex;gap:44px;align-items:flex-start;justify-content:center;padding:30px 22px 130px;flex-wrap:wrap}
  .phone{width:390px;height:844px;max-height:88vh;flex:0 0 auto;position:relative;overflow:hidden;background:var(--bg);border-radius:48px;border:11px solid #14141a;box-shadow:0 44px 100px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.04)}
  .notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:116px;height:24px;background:#000;border-radius:20px;z-index:60}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
  .screen .scroll{flex:1;overflow-y:auto;overflow-x:hidden;position:relative;z-index:2;scrollbar-width:none}
  .screen .scroll::-webkit-scrollbar{display:none}
  .screen .dock{flex:0 0 auto;position:relative;z-index:40}
  .screen .wash{position:absolute;inset:0;z-index:0;overflow:hidden}

  /* notas */
  .notes{width:364px;max-width:100%;flex:0 0 auto}
  .notes .card{background:rgba(16,16,22,.88);border:1px solid var(--hair);border-radius:22px;padding:22px;box-shadow:0 30px 70px rgba(0,0,0,.5)}
  .notes .tag{font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .notes h2{margin:9px 0 7px;font-size:19px;font-weight:600;letter-spacing:-.01em}
  .notes p{margin:0 0 12px;color:var(--ink-2);font-size:13px;line-height:1.62}
  .notes h4{margin:15px 0 6px;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .notes ul{margin:0;padding-left:16px;color:var(--ink-2);font-size:12.5px;line-height:1.6}
  .notes ul.good li::marker{color:#7fd6a8}
  .notes ul.watch li::marker{color:#e0b487}
  .notes .foot{margin-top:16px;padding-top:13px;border-top:1px solid var(--hair-2);color:var(--ink-3);font-size:11.5px;line-height:1.55}

  /* switcher de acento */
  .switcher{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:200;display:flex;align-items:center;gap:12px;padding:8px 12px;border-radius:999px;background:rgba(240,240,245,.97);backdrop-filter:blur(20px);color:#0a0a0d;font-weight:600;font-size:12px;box-shadow:0 16px 44px rgba(0,0,0,.6);white-space:nowrap}
  .switcher .lbl{min-width:104px}
  .switcher .lbl em{font-style:normal;color:#6a6a72;font-weight:500;display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase}
  .dots{display:flex;gap:7px}
  .dots button{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0;box-shadow:inset 0 0 0 1px rgba(0,0,0,.25)}
  .dots button.on{border-color:#0a0a0d;box-shadow:inset 0 0 0 2px #f4f4f6}
  .switcher .nav{width:30px;height:30px;border-radius:50%;border:none;background:#0a0a0d;color:#fff;font-size:14px;cursor:pointer;display:grid;place-items:center}
  .switcher .nav:hover{background:#2c2c36}

  /* ============ componentes do app ============ */
  .statusbar{display:flex;justify-content:space-between;align-items:center;padding:14px 24px 4px;font-size:12.5px;font-weight:500;position:relative;z-index:30}
  .statusbar.overlay{position:absolute;top:0;left:0;right:0;color:#fff;text-shadow:0 1px 10px rgba(0,0,0,.7)}
  .sbi{display:flex;gap:5px;align-items:center;opacity:.9}
  .sbi span{width:14px;height:9px;border:1.3px solid currentColor;border-radius:3px;display:inline-block}
  .sbi span::after{content:"";display:block;width:60%;height:100%;background:currentColor;border-radius:1px}
  .ico{width:20px;height:20px;display:block}

  .appbar{display:flex;align-items:center;gap:10px;padding:6px 14px;min-height:50px;position:relative;z-index:20}
  .appbar .tabtitle{font-size:15px;font-weight:600;letter-spacing:.01em}
  .appbar .spacer{flex:1}
  .iconbtn{width:38px;height:38px;border-radius:50%;border:1px solid transparent;background:transparent;color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
  .iconbtn:hover{background:rgba(255,255,255,.07)}
  .iconbtn.glassbtn{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-hair);color:#fff}

  .kicker{font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .meta-dot{font-size:12px;color:var(--ink-3);letter-spacing:.02em}
  .rule{height:1px;background:linear-gradient(90deg,var(--accent-line),transparent 78%);margin:16px 0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid transparent;cursor:pointer;font-weight:600;font-size:13.5px;border-radius:14px;padding:12px 18px;letter-spacing:.01em}
  .btn .ico{width:18px;height:18px}
  .btn-wide{width:100%}
  .btn-accent{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
  .btn-accent:hover{background:var(--accent-2);border-color:var(--accent-2)}
  .btn-ghost{background:transparent;border-color:var(--hair);color:var(--ink-2)}
  .btn-ghost:hover{background:rgba(255,255,255,.06)}
  .btn-glass{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-color:var(--glass-hair);color:var(--ink)}

  .seg{display:flex;gap:2px;padding:3px;border-radius:14px}
  .seg button{flex:1;border:none;background:transparent;color:var(--ink-3);font-weight:600;font-size:12.5px;padding:8px 6px;border-radius:11px;cursor:pointer;white-space:nowrap}
  .seg button.on{background:var(--accent-dim);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--accent-line)}

  .chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:999px;color:var(--ink-2)}
  .chip.on{color:var(--accent-ink);border-color:var(--accent-line);background:var(--accent-dim)}
  .tagchip{font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--ink-3);border:1px solid var(--hair);padding:5px 11px;border-radius:999px}

  .body-pad{padding:0 22px 24px}
  .section-label{margin:26px 0 11px;font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);font-weight:600}

  /* hero editorial */
  .band{position:relative;height:306px;overflow:hidden}
  .band>img{width:100%;height:100%;object-fit:cover;display:block;background:linear-gradient(150deg,#232433,#0c0c12)}
  .band .scrim{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(8,8,11,.74) 30%,rgba(8,8,11,.24) 62%,rgba(8,8,11,.42) 100%)}
  .band .float-top{position:absolute;top:46px;left:0;right:0;padding:0 16px;display:flex;justify-content:space-between;z-index:8}

  .edcontent{padding:0 22px 30px;margin-top:-52px;position:relative;z-index:8}
  .edtitle{font-family:'Cormorant Garamond',Georgia,serif;font-size:40px;line-height:1.02;margin:9px 0 10px;font-weight:600;letter-spacing:.005em}
  .edrow{display:flex;gap:16px;margin-top:16px}
  .poster-sm{width:98px;height:147px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .poster-sm img{width:100%;height:100%;object-fit:cover;display:block}
  .edsyn{font-size:12.8px;line-height:1.66;color:var(--ink-2);margin:0}

  /* episódios */
  .eplist{margin-top:6px;border-top:1px solid var(--hair-2)}
  .eprow{display:flex;align-items:center;gap:13px;padding:12px 0;border-bottom:1px solid var(--hair-2)}
  .eprow .still{width:104px;height:59px;border-radius:8px;overflow:hidden;flex:0 0 auto;position:relative;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .eprow .still img{width:100%;height:100%;object-fit:cover;display:block}
  .eprow .still .seen{position:absolute;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;color:#fff}
  .epno{font-variant-numeric:tabular-nums;font-size:12px;color:var(--accent);letter-spacing:.06em;width:18px;text-align:right;flex:0 0 auto}
  .epmeta{flex:1;min-width:0}
  .ept{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .eps{font-size:11px;color:var(--ink-3);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* elenco */
  .castrow{display:flex;gap:16px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
  .castrow::-webkit-scrollbar{display:none}
  .cast{width:62px;flex:0 0 auto;text-align:center}
  .cast .av{width:56px;height:56px;border-radius:50%;overflow:hidden;margin:0 auto;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .cast .av img{width:100%;height:100%;object-fit:cover}
  .cast .nm{font-size:10.5px;color:var(--ink-2);margin-top:7px;line-height:1.3}
  .cast .rl{font-size:9.5px;color:var(--ink-3);margin-top:2px}

  /* home */
  .hhero{position:relative;height:344px;overflow:hidden}
  .hhero>img{width:100%;height:100%;object-fit:cover;display:block;background:linear-gradient(150deg,#232433,#0c0c12)}
  .hhero .scrim{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 1%,rgba(8,8,11,.72) 30%,rgba(8,8,11,.15) 66%,rgba(8,8,11,.4) 100%)}
  .hhero .content{position:absolute;left:0;right:0;bottom:0;padding:0 22px 18px;z-index:8}
  .hhero h1{font-family:'Cormorant Garamond',Georgia,serif;font-size:34px;font-weight:600;margin:8px 0 8px;line-height:1.03}
  .hhero .cta{display:flex;gap:10px;margin-top:14px}

  .rail{margin-top:24px}
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;padding:0 22px 11px}
  .rail-head h3{margin:0;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2);font-weight:600}
  .rail-head span{font-size:11px;color:var(--ink-3)}
  .rail-scroll{display:flex;gap:11px;overflow-x:auto;padding:0 22px 4px;scrollbar-width:none}
  .rail-scroll::-webkit-scrollbar{display:none}
  .card{flex:0 0 auto;width:126px;cursor:pointer}
  .card .art{width:126px;height:189px;border-radius:12px;overflow:hidden;position:relative;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2);transition:transform .2s ease,border-color .2s ease}
  .card:hover .art{transform:translateY(-3px);border-color:var(--glass-hair)}
  .card .art img{width:100%;height:100%;object-fit:cover;display:block}
  .card .art .pbar{position:absolute;left:8px;right:8px;bottom:7px;height:3px;border-radius:999px;background:rgba(255,255,255,.3)}
  .card .art .pbar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .card .art .badge{position:absolute;top:7px;left:7px;font-size:9.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 7px;border-radius:7px;background:rgba(0,0,0,.6);backdrop-filter:blur(6px)}
  .card .name{margin-top:8px;font-size:11.5px;line-height:1.34;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* grade */
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .gtile{position:relative}
  .gtile .art{aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .gtile .art img{width:100%;height:100%;object-fit:cover;display:block}
  .gtile .name{margin-top:7px;font-size:11px;line-height:1.3;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

  /* busca */
  .searchfield{display:flex;align-items:center;gap:11px;padding:13px 15px;border-radius:16px;color:var(--ink-3)}
  .searchfield input{flex:1;background:none;border:none;outline:none;color:var(--ink);font-size:14px;font-family:inherit}
  .searchfield input::placeholder{color:var(--ink-3)}
  .topmatch{padding:18px;border-radius:20px}
  .tm-head{display:flex;align-items:center;gap:7px;color:var(--accent);font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
  .tm-row{display:flex;gap:15px;margin-top:14px}
  .poster-md{width:96px;height:144px;border-radius:10px;overflow:hidden;flex:0 0 auto;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .poster-md img{width:100%;height:100%;object-fit:cover;display:block}

  /* skeleton / spinner */
  .sk{background:linear-gradient(100deg,rgba(255,255,255,.05) 30%,rgba(255,255,255,.11) 50%,rgba(255,255,255,.05) 70%);background-size:200% 100%;animation:sk 1.4s ease-in-out infinite;border-radius:10px}
  @keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
  .spin{width:22px;height:22px;border-radius:50%;border:2px solid var(--accent-line);border-top-color:var(--accent);animation:rot .9s linear infinite}
  @keyframes rot{to{transform:rotate(360deg)}}

  /* lista */
  .rowitem{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:1px solid var(--hair-2)}
  .rowitem .poster-xs{width:42px;height:63px;border-radius:6px;overflow:hidden;flex:0 0 auto;background:linear-gradient(150deg,#232433,#0c0c12);border:1px solid var(--hair-2)}
  .rowitem .poster-xs img{width:100%;height:100%;object-fit:cover;display:block}
  .rowitem .meta{flex:1;min-width:0}
  .rowitem .t{font-size:13.5px;font-weight:500;line-height:1.3}
  .rowitem .s{font-size:11px;color:var(--ink-3);margin-top:3px}
  .rowitem .bar{height:3px;border-radius:999px;background:rgba(255,255,255,.14);margin-top:7px}
  .rowitem .bar i{display:block;height:100%;border-radius:999px;background:var(--accent)}
  .toggles{display:flex;gap:2px}
  .toggles .iconbtn{width:34px;height:34px;color:var(--ink-3)}
  .toggles .iconbtn.on{color:var(--accent)}

  .profile-tile{display:flex;align-items:center;gap:15px;padding:15px 0;border-bottom:1px solid var(--hair-2)}
  .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;font-weight:600;font-size:17px;color:#0a0a0f;flex:0 0 auto}

  /* ============ REMOTE · Cinemascope com sangria ============ */
  .wash img.wash-full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:blur(96px) saturate(1.4) brightness(.5);opacity:.09}
  .wash img.wash-glow{position:absolute;top:-60px;left:50%;width:460px;height:460px;transform:translateX(-50%);object-fit:cover;filter:blur(76px) saturate(1.5) brightness(.6);opacity:.2;
    -webkit-mask-image:radial-gradient(circle at 50% 44%, #000 0%, transparent 68%);mask-image:radial-gradient(circle at 50% 44%, #000 0%, transparent 68%)}
  .wash .veil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,11,.25),rgba(8,8,11,.62) 52%,var(--bg) 86%)}

  .l2band{position:relative;height:456px;overflow:hidden}
  .l2band>img{width:100%;height:100%;object-fit:cover;display:block;background:linear-gradient(150deg,#232433,#0c0c12)}
  .l2band .scrim{position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 2%,rgba(8,8,11,.86) 24%,rgba(8,8,11,.3) 58%,rgba(8,8,11,.28) 100%)}
  .l2band .top{position:absolute;top:46px;left:0;right:0;padding:0 16px;display:flex;justify-content:space-between;z-index:8}
  .l2band .content{position:absolute;left:0;right:0;bottom:0;padding:0 24px 20px;z-index:8}
  .l2band .rmtitle{font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:600;line-height:1.03;margin:9px 0 0}
  .rmlabel{font-size:10.5px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .rmline{font-size:12px;color:var(--ink-2);margin-top:8px}
  .rmtarget{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;color:var(--ink-3);margin-top:10px}
  .rmnext{display:flex;align-items:center;gap:10px;margin-top:14px;font-size:11.5px;color:var(--ink-2)}
  .rmnext .th{width:52px;height:30px;border-radius:6px;overflow:hidden;flex:0 0 auto;border:1px solid var(--hair-2)}
  .rmnext .th img{width:100%;height:100%;object-fit:cover}

  .progress{position:relative;height:4px;border-radius:999px;background:rgba(255,255,255,.16);margin-top:18px}
  .progress i{position:absolute;top:0;bottom:0;left:0;width:38%;border-radius:999px;background:linear-gradient(90deg,var(--accent),var(--accent-2))}
  .progress .knob{position:absolute;top:50%;left:38%;transform:translate(-50%,-50%);width:12px;height:12px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-dim)}
  .times{display:flex;justify-content:space-between;font-size:10.5px;color:var(--ink-3);margin-top:8px;font-variant-numeric:tabular-nums}
  .transport{display:flex;align-items:center;justify-content:center;gap:30px;margin-top:22px}
  .transport .side{width:48px;height:48px;border-radius:50%;border:1px solid var(--hair);background:transparent;color:var(--ink-2);display:grid;place-items:center;cursor:pointer}
  .transport .side:hover{background:rgba(255,255,255,.06);color:var(--ink)}
  .transport .big{width:70px;height:70px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;cursor:pointer;box-shadow:0 18px 40px color-mix(in srgb,var(--accent) 38%,transparent)}

/* ============ helpers ============ */
const img = (src, cls = '') => `<img class="${cls}" src="${src}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.style.display='none'">`;
const statusbar = (o) => `<div class="statusbar${o ? ' overlay' : ''}"><span>9:41</span><span class="sbi"><span></span><span></span></span></div>`;
const navbar = (active) => `<div class="navbar">${[['home',I.home,'Home'],['search',I.search,'Busca'],['remote',I.tv,'Remote'],['myStuff',I.bookmark,'Minha Lista'],['profile',I.person,'Perfil']].map(([k,ic,l]) => `<div class="navitem${k===active?' active':''}">${ic}<span>${l}</span><div class="navind"></div></div>`).join('')}</div>`;
const playerbar = () => `<div class="playerbar"><div class="pp">${img(NP.poster)}</div><div class="meta"><div class="t">${NP.title}</div><div class="s">${NP.episode}</div><div class="pbar"><i style="width:38%"></i></div></div><button class="iconbtn" title="Pausar">${I.pause}</button></div>`;
const dock = (active, nav) => `<div class="dockwrap">${playerbar()}${nav ? navbar(active) : ''}</div>`;
const appbar = (title, { back=false, gear=false } = {}) => `<header class="appbar">${back?`<button class="iconbtn" data-screen="home">${I.back}</button>`:''}<div class="tabtitle">${title}</div><div class="spacer"></div>${gear?`<button class="iconbtn" data-screen="settings" title="Ajustes">${I.gear}</button>`:''}</header>`;
const card = (name, s, { progress, badge, go='detail-movie' } = {}) => `<div class="card" data-screen="${go}"><div class="art">${img(seed(s,300,450))}${badge?`<div class="badge">${badge}</div>`:''}${progress!=null?`<div class="pbar"><i style="width:${progress}%"></i></div>`:''}</div><div class="name">${name}</div></div>`;
const rail = (title, more, items) => `<section class="rail"><div class="rail-head"><h3>${title}</h3><span>${more} ›</span></div><div class="rail-scroll">${items.map((it) => Array.isArray(it) ? card(it[0], it[1], it[2]||{}) : it).join('')}</div></section>`;
const grid3 = (items, go) => `<div class="grid3">${items.map(([name,s]) => `<div class="gtile"${go?` data-screen="${go}"`:''}><div class="art">${img(seed(s,300,450))}</div><div class="name">${name}</div></div>`).join('')}</div>`;
const castRow = (list) => `<div class="castrow">${list.map(([n,r,s]) => `<div class="cast"><div class="av">${img(seed(s,120,120))}</div><div class="nm">${n}</div><div class="rl">${r}</div></div>`).join('')}</div>`;

function episodeList() {
  return `<div class="eplist">${SERIES.episodes.map(([t,d,o,seen],i) => `<div class="eprow">
    <div class="still">${img(seed('harbor-ep'+(i+1),240,135))}${seen?`<div class="seen">${I.check.replace('class="ico"','class="ico" style="width:18px;height:18px"')}</div>`:''}</div>
    <span class="epno">${String(i+1).padStart(2,'0')}</span>
    <div class="epmeta"><div class="ept">${t}</div><div class="eps">${o}</div></div>
    <button class="iconbtn" title="Reproduzir">${I.play}</button></div>`).join('')}</div>`;
}

      <h1 class="serif" style="font-size:28px;font-weight:600;margin:8px 0 16px;line-height:1.05">Escaneando a rede local</h1>
      <div class="listrow" style="text-align:left"><div class="dot ok">${I.check}</div><div class="meta"><div class="t">menoti pc</div><div class="s">192.168.200.100:11471</div></div><button class="btn btn-accent" style="padding:9px 14px;font-size:12.5px">Usar</button></div>
      <div class="listrow"><div class="dot" style="border:1px dashed var(--hair)"></div><div class="meta"><div class="t">Sala-TV</div><div class="s">192.168.200.142:11471</div></div><button class="btn btn-ghost" style="padding:9px 14px;font-size:12.5px">Usar</button></div>
      <button class="btn btn-ghost btn-wide" style="margin-top:18px">Cancelar</button></div></div></div>`;
}

const RENDER = {
  home:homeScreen, 'detail-series':()=>detailScreen('series'), 'detail-movie':()=>detailScreen('movie'),
  'search-idle':searchIdle, 'search-loading':searchLoading, 'search-results':searchResults,
  mystuff:myStuff, profile, remote:remoteScreen, grid:gridScreen, settings, homerows:homeRows,
  connect, 'connect-scanning':connectScanning,
};

/* ============ acento / estado ============ */
const ACCENTS = [
  ['indigo','Índigo','#8f97ff'], ['violet','Violeta','#b98cff'], ['gold','Dourado','#e3b768'],
  ['coral','Coral','#ff7a6b'], ['teal','Turquesa','#5fd3c6'], ['green','Verde','#86d9a4'], ['sky','Céu','#6fb6ff'],
];
const ACC = Object.fromEntries(ACCENTS.map(([k,n,h]) => [k,{name:n,hex:h}]));

const q = new URLSearchParams(location.search);
const state = {
  screen: RENDER[q.get('screen')] ? q.get('screen') : 'remote',
  accent: ACC[q.get('accent')] ? q.get('accent') : 'indigo',
};

function applyAccent() {
  document.documentElement.style.setProperty('--accent', ACC[state.accent].hex);
}

function render() {
  applyAccent();
  document.getElementById('app').innerHTML = RENDER[state.screen]();
  document.getElementById('screens').innerHTML = SCREENS.map(([k,l]) => `<button data-screen="${k}" class="${state.screen===k?'active':''}">${l}</button>`).join('');
  const n = NOTES[state.screen];
  document.getElementById('notes').innerHTML = `<span class="tag">${n.tag}</span><h2>${n.title}</h2><p>${n.p}</p>
    <h4>O que ganha</h4><ul class="good">${n.good.map((x)=>`<li>${x}</li>`).join('')}</ul>
    <h4>O que vigiar</h4><ul class="watch">${n.watch.map((x)=>`<li>${x}</li>`).join('')}</ul>
    <div class="foot">Protótipo final. Remote em Cinemascope com sangria; Navigate fora da primeira dobra; fundo com blur sutil da capa; miniplayer de vidro. Acento: <b style="color:${ACC[state.accent].hex}">${ACC[state.accent].name}</b>. Posters são placeholders.</div>`;
  document.getElementById('accname').textContent = ACC[state.accent].name;
  document.getElementById('dots').innerHTML = ACCENTS.map(([k,,h]) => `<button data-accent="${k}" title="${ACC[k].name}" class="${state.accent===k?'on':''}" style="background:${h}"></button>`).join('');
  document.getElementById('hint').textContent = `?screen=${state.screen}&accent=${state.accent}`;
  try { const u=new URL(location.href); u.searchParams.set('screen',state.screen); u.searchParams.set('accent',state.accent); history.replaceState(null,'',u); } catch(_) {}
}

function setAccent(k) { if (ACC[k]) { state.accent = k; render(); } }
function cycleAccent(step) { const i = ACCENTS.findIndex((a)=>a[0]===state.accent); state.accent = ACCENTS[(i+step+ACCENTS.length)%ACCENTS.length][0]; render(); }

document.addEventListener('click', (e) => {
  const st = e.target.closest('[data-step]'); if (st) { cycleAccent(Number(st.dataset.step)); return; }
  const ac = e.target.closest('[data-accent]'); if (ac) { setAccent(ac.dataset.accent); return; }
  const s = e.target.closest('[data-screen]'); if (s && RENDER[s.dataset.screen]) { state.screen = s.dataset.screen; render(); }
});
document.addEventListener('keydown', (e) => {
  const t=e.target; if (t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.isContentEditable)) return;
  if (e.key==='ArrowLeft') cycleAccent(-1);
  if (e.key==='ArrowRight') cycleAccent(1);
});
render();
</script>
</body>
</html>
